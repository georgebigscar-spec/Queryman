name: Build

# Release-сборки для Linux и Windows. На каждый push в main и PR бинарники
# доступны как артефакты запуска; тег v* дополнительно создаёт GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            bin: queryman
          - name: windows-x86_64
            os: windows-latest
            bin: queryman.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: cargo build --release
        run: cargo build -p queryman-app --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/queryman
          cp target/release/${{ matrix.bin }} README.md dist/queryman/
          tar -C dist -czf dist/queryman-${{ matrix.name }}.tar.gz queryman
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/queryman | Out-Null
          Copy-Item target/release/${{ matrix.bin }}, README.md dist/queryman/
          Compress-Archive -Path dist/queryman -DestinationPath dist/queryman-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: queryman-${{ matrix.name }}
          path: dist/queryman-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
